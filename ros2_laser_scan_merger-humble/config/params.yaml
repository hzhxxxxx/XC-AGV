/ros2_laser_scan_merger:
  ros__parameters:
    flip1: false
    flip2: false
    inverse1: false
    inverse2: false
    laser1Alpha: 0.0
    laser1AngleMax: 181.0
    laser1AngleMin: -181.0
    laser1B: 0
    laser1G: 0
    laser1R: 255
    laser1XOff: 0.1975
    laser1YOff: 0.0
    laser1ZOff: 0.0
    laser2Alpha: 0.0
    laser2AngleMax: 360.0
    laser2AngleMin: 0.0
    laser2B: 255
    laser2G: 0
    laser2R: 0
    laser2XOff: -0.1975
    laser2YOff: 0.0
    laser2ZOff: 0.0
    pointCloudTopic: cloud_in
    pointCloutFrameId: base_link
    qos_overrides./parameter_events.publisher.depth: 1000
    # qos_overrides./parameter_events.publisher.durability: volatile
    # qos_overrides./parameter_events.publisher.history: keep_last
    qos_overrides./parameter_events.publisher.reliability: best_effort
    scanTopic1: /scan_m10
    scanTopic2: /scan_ms200
    show1: true
    show2: true
    use_sim_time: false

/pointcloud_to_laserscan:
  ros__parameters:
    angle_increment: 0.01745
    angle_max: 3.14
    angle_min: -3.14
    inf_epsilon: 1.0
    max_height: 0.5
    min_height: -0.1
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          reliability: best_effort
      /scan:
        publisher:
          reliability: reliable
    queue_size: 16
    range_max: 20.0
    range_min: 0.1
    scan_time: 0.3333
    target_frame: base_link
    transform_tolerance: 0.01
    use_inf: true
    use_sim_time: false
